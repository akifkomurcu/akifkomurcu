<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="100%" height="auto" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">
<defs>
  <clipPath id="cardClip">
    <rect width="600px" height="410px" rx="15"/>
  </clipPath>
</defs>
<style>
.key { fill: #bc4c00; font-weight: 500; font-size: 16px; }
.value { fill: #0969da; font-size: 16px; }
.addColor { fill: #1a7f37; font-size: 16px; }
.delColor { fill: #cf222e; font-size: 16px; }
.cc { fill: #6e7781; font-size: 16px; }
.title { fill: #24292f; font-size: 16px; }
text, tspan { white-space: pre; }
</style>

<!-- Card Base -->
<rect width="600px" height="410px" fill="#ffffff" rx="15" stroke="#d0d7de" stroke-width="1"/>

<!-- Neofetch Content -->
<g clip-path="url(#cardClip)" font-size="16px">
  <text x="25" y="30" xml:space="preserve"><tspan class="key">akif@komurcu </tspan><tspan class="cc">---------------------------------------------</tspan></text>
  <text x="25" y="50" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Host:</tspan><tspan class="cc">...............................</tspan><tspan class="value">Full Stack Developer</tspan></text>
  <text x="25" y="70" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Uptime:</tspan><tspan class="cc">.......................</tspan><tspan class="value">6 years, 8 months, 12 days</tspan></text>
  <text x="25" y="90" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Kernel:</tspan><tspan class="cc">............</tspan><tspan class="value">React, React Native, Angular, Next.js</tspan></text>
  <text x="25" y="110" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Databases:</tspan><tspan class="cc">.................</tspan><tspan class="value">PostgreSQL, MongoDB, Supabase</tspan></text>
  <text x="25" y="130" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">DevOps:</tspan><tspan class="cc">....................</tspan><tspan class="value">Docker, Jenkins, Nginx, Linux</tspan></text>
  <text x="25" y="150" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="170" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Languages.Code:</tspan><tspan class="cc">....</tspan><tspan class="value">TypeScript, JavaScript, Swift, Kotlin</tspan></text>
  <text x="25" y="190" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Frontend:</tspan><tspan class="cc">.........</tspan><tspan class="value">React, React Native, Angular, Tailwind</tspan></text>
  <text x="25" y="210" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Backend:</tspan><tspan class="cc">.............</tspan><tspan class="value">NestJS, Node.js, Express, REST APIs</tspan></text>
  <text x="25" y="230" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="250" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Native:</tspan><tspan class="cc">..............</tspan><tspan class="value">Swift (macOS/iOS), Kotlin (Android)</tspan></text>
  <text x="25" y="270" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Tools:</tspan><tspan class="cc">...............</tspan><tspan class="value">Git, GitHub Actions, Xcode, Postman</tspan></text>
  <text x="25" y="290" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Focus:</tspan><tspan class="cc">..................</tspan><tspan class="value">Web + Mobile Product Engineering</tspan></text>
  <text x="25" y="310" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="330" xml:space="preserve"><tspan class="cc">- </tspan><tspan class="title">GitHub Stats </tspan><tspan class="cc">-------------------------------------------</tspan></text>
  <text x="25" y="350" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Repos: </tspan><tspan class="value">0</tspan><tspan class="key"> {Contributed: </tspan><tspan class="value">0</tspan><tspan class="key">}</tspan><tspan class="cc"> | </tspan><tspan class="key">Stars: </tspan><tspan class="cc">....................</tspan><tspan class="value">0</tspan></text>
  <text x="25" y="370" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Commits:</tspan><tspan class="cc">................</tspan><tspan class="value">0</tspan><tspan class="cc"> | </tspan><tspan class="key">Followers: </tspan><tspan class="cc">................</tspan><tspan class="value">0</tspan></text>
  <text x="25" y="390" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Lines of Code:</tspan><tspan class="cc">..........</tspan><tspan class="value">0</tspan><tspan class="cc"> ( </tspan><tspan class="addColor">0++</tspan><tspan class="cc">, </tspan><tspan class="delColor">0-- </tspan><tspan class="cc">................. )</tspan></text>

</g>
</svg>

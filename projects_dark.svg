<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" width="100%" height="auto" xml:space="preserve" font-family="Consolas, 'Courier New', monospace">
<defs>
  <clipPath id="cardClip">
    <rect width="600px" height="610px" rx="15"/>
  </clipPath>
</defs>
<style>
.key { fill: #ffa657; font-weight: 500; font-size: 16px; }
.value { fill: #a5d6ff; font-size: 16px; }
.addColor { fill: #3fb950; font-size: 16px; }
.delColor { fill: #f85149; font-size: 16px; }
.cc { fill: #616e7f; font-size: 16px; }
.title { fill: #c9d1d9; font-size: 16px; }
text, tspan { white-space: pre; }
</style>

<!-- Card Base -->
<rect width="600px" height="610px" fill="#0d1017" rx="15" />

<!-- Neofetch Content -->
<g clip-path="url(#cardClip)" font-size="16px">
  <text x="25" y="30" xml:space="preserve"><tspan class="cc">- </tspan><tspan class="title">Featured Projects </tspan><tspan class="cc">--------------------------------------</tspan></text>
  <text x="25" y="50" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Apptionly:</tspan><tspan class="cc">.......</tspan><tspan class="value">React 19, Zustand, Tailwind 4, Supabase</tspan></text>
  <text x="25" y="70" xml:space="preserve"><tspan class="cc">    App Store screenshot generator: canvas rendering,</tspan></text>
  <text x="25" y="90" xml:space="preserve"><tspan class="cc">    undo/redo, PWA.</tspan></text>
  <text x="25" y="110" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="130" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">maarifhan:</tspan><tspan class="cc">.......................................</tspan><tspan class="value">Angular</tspan></text>

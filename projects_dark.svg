  <text x="25" y="170" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="190" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">maarifhan-be:</tspan><tspan class="cc">.....................................</tspan><tspan class="value">NestJS</tspan></text>

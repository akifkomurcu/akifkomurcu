  <text x="25" y="230" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="250" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">TapLocks:</tspan><tspan class="cc">..........................................</tspan><tspan class="value">Swift</tspan></text>
  <text x="25" y="270" xml:space="preserve"><tspan class="cc">    Lets you easily lock your screen. macOS app.</tspan></text>
  <text x="25" y="290" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="310" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Shelf:</tspan><tspan class="cc">.............................................</tspan><tspan class="value">Swift</tspan></text>
  <text x="25" y="330" xml:space="preserve"><tspan class="cc">    macOS menu bar icon manager, native Command+Drag.</tspan></text>
  <text x="25" y="350" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="370" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Moon Tracker:</tspan><tspan class="cc">...............................</tspan><tspan class="value">React Native</tspan></text>
  <text x="25" y="390" xml:space="preserve"><tspan class="cc">    iOS moon phase/lunar cycle tracker.</tspan></text>
  <text x="25" y="410" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="430" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">FloatX (Sliding Apps):</tspan><tspan class="cc">............................</tspan><tspan class="value">Kotlin</tspan></text>
  <text x="25" y="450" xml:space="preserve"><tspan class="cc">    Android floating multitasking hub.</tspan></text>
  <text x="25" y="470" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="490" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">Product Alarm:</tspan><tspan class="cc">............................</tspan><tspan class="value">Python, Docker</tspan></text>
  <text x="25" y="510" xml:space="preserve"><tspan class="cc">    Price-tracking scraper (Akakçe, Trendyol,</tspan></text>
  <text x="25" y="530" xml:space="preserve"><tspan class="cc">    Hepsiburada) with Telegram alerts.</tspan></text>
  <text x="25" y="550" xml:space="preserve"><tspan class="cc">. </tspan></text>
  <text x="25" y="570" xml:space="preserve"><tspan class="cc">. </tspan><tspan class="key">idm-cli:</tspan><tspan class="cc">..........................................</tspan><tspan class="value">Python</tspan></text>
  <text x="25" y="590" xml:space="preserve"><tspan class="cc">    Download tool like idm, works on terminal.</tspan></text>

</g>
</svg>
